<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akaunti Yangu - GSM Fashion 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- Header same as index.html -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between flex-wrap">
            <div class="flex items-center space-x-2">
                <i class="fas fa-tshirt text-2xl text-orange-500"></i>
                <span class="text-xl font-bold text-gray-800">GSM Fashion 2026</span>
            </div>
            <nav class="hidden md:flex space-x-6">
                <a href="index.html" class="text-gray-700 hover:text-orange-500">Nyumbani</a>
                <a href="men.html" class="text-gray-700 hover:text-orange-500">Wanaume</a>
                <a href="women.html" class="text-gray-700 hover:text-orange-500">Wanawake</a>
                <a href="children.html" class="text-gray-700 hover:text-orange-500">Watoto</a>
                <a href="shoes.html" class="text-gray-700 hover:text-orange-500">Viatu</a>
                <a href="accessories.html" class="text-gray-700 hover:text-orange-500">Vifaa</a>
                <a href="cart.html" class="text-gray-700 hover:text-orange-500 relative">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count" class="absolute -top-2 -right-3 bg-red-500 text-white text-xs rounded-full px-1.5">0</span>
                </a>
                <li class="auth-link" id="auth-link">
                    <a href="login.html" class="text-gray-700 hover:text-orange-500"><i class="fas fa-sign-in-alt"></i> Ingia</a>
                </li>
            </nav>
            <button class="md:hidden text-gray-600" id="menu-btn">
                <i class="fas fa-bars text-2xl"></i>
            </button>
        </div>
    </header>

    <div class="container mx-auto px-4 py-12">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-bold text-center mb-6">Akaunti Yangu</h2>
            <div id="profile-info">
                <p class="text-center text-gray-500">Inapakia...</p>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateAuthUI();
            loadProfile();
        });

        async function loadProfile() {
            const token = localStorage.getItem('gsmToken');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            try {
                const res = await fetch('http://localhost:5000/api/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('profile-info').innerHTML = `
                        <p><strong>Jina:</strong> ${data.user.name}</p>
                        <p><strong>Barua pepe:</strong> ${data.user.email}</p>
                        <p><strong>ID ya mtumiaji:</strong> ${data.user.userId}</p>
                    `;
                } else {
                    document.getElementById('profile-info').innerHTML = '<p class="text-red-500">Tatizo la kupata data. Tafadhali ingia tena.</p>';
                }
            } catch (error) {
                document.getElementById('profile-info').innerHTML = '<p class="text-red-500">Tatizo la mtandao. Jaribu tena.</p>';
            }
        }
    </script>
</body>
</html>
