<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body class="bg-gray-50 font-sans">

    <!-- Header (embedded for simplicity) -->

        <div class="container mx-auto px-4 py-3 flex items-center justify-between flex-wrap">
            <div class="flex items-center space-x-2">
                <i class="fas fa-tshirt text-2xl text-orange-500"></i>
                <span class="text-xl font-bold text-gray-800">GSM Fashion 2026</span>
            </div>
            <nav class="hidden md:flex space-x-6">
                <a href="index.html" class="text-gray-700 hover:text-orange-500">Nyumbani</a>
                <a href="men.html" class="text-gray-700 hover:text-orange-500">Wanaume</a>
                <a href="women.html" class="text-gray-700 hover:text-orange-500">Wanawake</a>
                <a href="children.html" class="text-gray-700 hover:text-orange-500">Watoto</a>
                <a href="shoes.html" class="text-gray-700 hover:text-orange-500">Viatu</a>
                <a href="accessories.html" class="text-gray-700 hover:text-orange-500">Vifaa</a>
                <a href="cart.html" class="text-gray-700 hover:text-orange-500 relative">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count" class="absolute -top-2 -right-3 bg-red-500 text-white text-xs rounded-full px-1.5">0</span>
                </a>
                <li class="auth-link" id="auth-link">
                    <a href="login.html" class="text-gray-700 hover:text-orange-500"><i class="fas fa-sign-in-alt"></i> Ingia</a>
                </li>
            </nav>
            <button class="md:hidden text-gray-600" id="menu-btn">
                <i class="fas fa-bars text-2xl"></i>
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-gradient-to-r from-orange-500 to-orange-600 text-white py-20">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">Mtindo Mpya 2026</h1>
            <p class="text-xl mb-8">Gharama Nafuu, Ubora wa Juu, Uwakilishi wa Kipekee</p>
            <a href="#featured" class="bg-white text-orange-500 px-8 py-3 rounded-full font-semibold hover:bg-gray-100 transition">Nunua Sasa</a>
        </div>
    </section>

    <!-- Featured Products -->
    <section id="featured" class="py-16">
        <div class="container mx-auto px-4">
            <h2 class="text-3xl font-bold text-center mb-12">Bidhaa Zilizochaguliwa</h2>
            <div id="featured-products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Dynamically loaded -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2026 GSM Fashion. Haki zote zimehifadhiwa. | 0686835513 | georgesabato860@gmail.com | Mwanza</p>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/data/products.js"></script>
