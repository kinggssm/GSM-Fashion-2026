<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vifaa - GSM Fashion 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header (same as index) -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between flex-wrap">
            <div class="flex items-center space-x-2">
                <i class="fas fa-tshirt text-2xl text-orange-500"></i>
                <span class="text-xl font-bold text-gray-800">GSM Fashion 2026</span>
            </div>
            <nav class="hidden md:flex space-x-6">
                <a href="index.html" class="text-gray-700 hover:text-orange-500">Nyumbani</a>
                <a href="men.html" class="text-gray-700 hover:text-orange-500">Wanaume</a>
                <a href="women.html" class="text-gray-700 hover:text-orange-500">Wanawake</a>
                <a href="children.html" class="text-gray-700 hover:text-orange-500">Watoto</a>
                <a href="shoes.html" class="text-gray-700 hover:text-orange-500">Viatu</a>
                <a href="accessories.html" class="text-orange-500 font-semibold">Vifaa</a>
                <a href="cart.html" class="text-gray-700 hover:text-orange-500 relative">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count" class="absolute -top-2 -right-3 bg-red-500 text-white text-xs rounded-full px-1.5">0</span>
                </a>
                <li class="auth-link" id="auth-link">
                    <a href="login.html" class="text-gray-700 hover:text-orange-500"><i class="fas fa-sign-in-alt"></i> Ingia</a>
                </li>
            </nav>
            <button class="md:hidden text-gray-600" id="menu-btn">
                <i class="fas fa-bars text-2xl"></i>
            </button>
        </div>
    </header>

    <!-- Banner for Accessories -->
    <section class="bg-gradient-to-r from-purple-500 to-purple-600 text-white py-12">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl md:text-4xl font-bold">Vifaa na Mapambo</h1>
            <p class="text-lg mt-2">Kamilisha Mtindo Wako kwa Vifaa Bora</p>
        </div>
    </section>

    <!-- Products Grid -->
    <section class="py-16">
        <div class="container mx-auto px-4">
            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Products loaded by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2026 GSM Fashion. Haki zote zimehifadhiwa. | 0686835513 | georgesabato860@gmail.com | Mwanza</p>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/data/products.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadCategoryProducts('accessories');
            updateAuthUI();
        });
    </script>
</body>
</html>
